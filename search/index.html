<style>
  body { background: #fff; }
  .home-top { text-align: right; padding: 10px 16px; font-size: 12px; }
  .home-top a { margin-left: 14px; }
  .logo-area { text-align: center; margin-top: 90px; }

  .search-area { width: 560px; margin: 22px auto 0; position: relative; }

  }

  }
  #suggest-box .item { padding: 5px 10px; font-size: 13px; cursor: pointer; }
  #suggest-box .item:hover, #suggest-box .item.on { background: #e6f0fc; }
  .hot-area { width: 560px; margin: 40px auto 0; font-size: 13px; }
  .hot-area h4 { font-size: 14px; color: #a31515; margin-bottom: 8px; }
  .hot-area a { margin-right: 16px; line-height: 2.2; }
  .disclaimer {
    width: 560px; margin: 50px auto 0; font-size: 11px; color: #999; line-height: 2;
    border-top: 1px solid #eee; padding-top: 14px;
  }
</style>
</head>
<body>

<script>
(function () {
  /* 简单相关推荐词库 */
  var LEXICON = [
    '花卷走丢', '花卷 走丢', '找猫 花卷', '白猫 花卷', '花卷后来', '花卷近况', '老沈猫',
    '沈知栀', '沈知栀 获奖', '沈知栀 作文', '沈知栀 海边', '沈知栀 画画比赛', '沈知栀 20120817',
    '我的小猫花卷', '滨城实验小学', '滨城实验小学 沈知栀',
    '心内二科', '滨城儿童医院', '先天性心脏病 救助', '先心病 滨城',
    '小猫', '作文获奖', '滨城天气', '滨城二手房', '广场舞教学', '定胜糕做法'
  ];
  var kw = document.getElementById('kw');
  var box = document.getElementById('suggest-box');

  function render(list) {
    if (!list.length) { box.style.display = 'none'; return; }
    box.innerHTML = '';
    list.forEach(function (word) {
      var div = document.createElement('div');
      div.className = 'item';
      div.textContent = word;
      div.onmousedown = function () { kw.value = word; box.style.display = 'none'; document.getElementById('search-form').submit(); };
      box.appendChild(div);
    });
    box.style.display = 'block';
  }
  kw.oninput = function () {
    var v = kw.value.trim();
    if (!v) { box.style.display = 'none'; return; }
    var low = v.toLowerCase();
    var hits = LEXICON.filter(function (w) {
      return w.replace(/\s+/g, '').indexOf(low.replace(/\s+/g, '')) >= 0;
    }).slice(0, 8);
    render(hits);
  };
  kw.onblur = function () { setTimeout(function () { box.style.display = 'none'; }, 200); };
  kw.onfocus = function () { if (kw.value.trim()) kw.oninput(); };
})();
</script>
