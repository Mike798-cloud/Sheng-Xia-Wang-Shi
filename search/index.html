<script>
(function () {
  /* 简单相关推荐词库 */
  var LEXICON = SearchDB.SUGGESTIONS;
  var kw = document.getElementById('kw');
  var box = document.getElementById('suggest-box');
  var composing = false;

  function hide(){box.style.display='none';kw.setAttribute('aria-expanded','false');}
  function render(list) {
    if (!list.length) { hide(); return; }
    box.innerHTML = '';
    list.forEach(function (word) {
      var div = document.createElement('div');
      div.className = 'item';
      div.textContent = word;
      div.setAttribute('role','option'); div.tabIndex = 0;
      function choose() { kw.value = word; hide(); document.getElementById('search-form').requestSubmit(); }
      div.onclick = choose; div.onmousedown = function(e) { e.preventDefault(); };
      div.onkeydown = function(e) {
        if(e.isComposing||e.keyCode===229)return;
        if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}
        else if(e.key==='ArrowDown'){e.preventDefault();(div.nextElementSibling||box.firstElementChild).focus();}
        else if(e.key==='ArrowUp'){e.preventDefault();(div.previousElementSibling||kw).focus();}
        else if(e.key==='Escape'){e.preventDefault();kw.focus();hide();}
      };
      box.appendChild(div);
    });
    box.style.display = 'block';kw.setAttribute('aria-expanded','true');
  }
  kw.setAttribute('aria-label','搜索旧网页');
  kw.setAttribute('role','combobox');kw.setAttribute('aria-expanded','false');kw.setAttribute('aria-autocomplete','list');kw.setAttribute('aria-controls','suggest-box'); box.setAttribute('role','listbox');
  kw.onkeydown = function(e) { if(composing||e.isComposing||e.keyCode===229)return; if(e.key === 'ArrowDown' && box.firstElementChild && box.style.display !== 'none'){ e.preventDefault(); box.firstElementChild.focus(); } if(e.key === 'Escape'){e.preventDefault();hide();} };
  kw.addEventListener('compositionstart',function(){composing=true;hide();});
  kw.addEventListener('compositionend',function(){composing=false;kw.oninput();});
  kw.oninput = function (e) {
    if(composing||(e&&e.isComposing)){hide();return;}
    var v = kw.value.trim();
    if (!v) { hide(); return; }
    var low = SearchDB.normalize(v);
    var hits = LEXICON.filter(function (w) {
      return SearchDB.normalize(w).indexOf(low) >= 0;
    }).slice(0, 8);
    render(hits);
  };
  kw.onblur = function () { setTimeout(function () { if (!box.contains(document.activeElement)) hide(); }, 200); };
  box.addEventListener('focusout',function(){setTimeout(function(){if(!box.contains(document.activeElement)&&document.activeElement!==kw)hide();},0);});
  kw.onfocus = function () { if (kw.value.trim()) kw.oninput(); };
})();
</script>
